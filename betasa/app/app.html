<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بت آسا — بازی رایگان با سکه</title>
<meta name="description" content="بت آسا — پلتفرم بازی و سرگرمی رایگان با سکه مجازی. بدون پول واقعی.">
<meta name="theme-color" content="#0b1520">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/Vazirmatn-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/betasa.css">
<script>
/* جلوگیری از فلش تم اشتباه، قبل از لود اپ */
try{
  var t = localStorage.getItem("betasa-theme");
  if(t === "dark" || t === "light") document.documentElement.dataset.theme = t;
}catch(e){}
</script>
</head>
<body>
<header class="app-header">
  <a class="brand" href="index.html" aria-label="بت آسا — صفحهٔ معرفی">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 120 120" width="30" height="30">
        <g fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M30 100 L30 62 Q30 33 60 18 Q90 33 90 62 L90 100"/>
          <path d="M18 106 H102"/>
        </g>
        <path d="M60 19 L71.5 32 L60 45 L48.5 32 Z" fill="currentColor"/>
      </svg>
    </span>
    <span class="brand-name">بت آسا</span>
  </a>
  <div class="header-tools">
    <a id="coin-chip" class="coin-chip" href="#/wallet" title="کیف سکه">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><text x="12" y="16" text-anchor="middle" font-size="10" fill="currentColor">س</text></svg>
      <span id="coin-balance" class="mono">۰</span>
      <span class="coin-word">سکه</span>
    </a>
    <a id="account-chip" class="account-chip" href="#/signin" title="ورود">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>
      <span class="account-label">ورود</span>
    </a>
    <button id="theme-toggle" class="theme-btn" type="button" aria-label="تغییر تم روشن/تاریک">◐</button>
  </div>
</header>

<main id="view" class="view" tabindex="-1"></main>

<div id="install-strip" class="install-strip" hidden>
  <span>بت آسا را روی دستگاه خود نصب کنید — سریع‌تر و آفلاین.</span>
  <button id="install-btn" class="btn btn-gold" type="button">نصب</button>
  <button id="install-dismiss" class="btn btn-ghost" type="button" aria-label="بستن">✕</button>
</div>

<footer class="app-footer">
  <p>بت آسا یک پلتفرم <strong>تفریحی رایگان</strong> است — تمام بازی‌ها با سکهٔ مجازی انجام می‌شود و هیچ پول واقعی، واریز، برداشت یا جایزهٔ نقدی در کار نیست.</p>
  <p style="margin-top:8px">
    <a href="index.html" style="text-decoration:underline">دربارهٔ بت آسا</a> ·
    <a href="design-system.html" style="text-decoration:underline">دیزاین‌سیستم</a>
  </p>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
