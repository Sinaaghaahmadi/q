        d="M26 98 L26 60 Q26 26 60 10 Q94 26 94 60 L94 98 Z
           M60 30 L73 45 L60 60 L47 45 Z"/>
  <rect x="16" y="104" width="88" height="10" rx="5" fill="currentColor"/>
