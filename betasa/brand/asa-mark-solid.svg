<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="asas-t asas-d">
  <title id="asas-t">آسا</title>
  <desc id="asas-d">نسخهٔ تو‌پُرِ نشانِ آسا برای اندازه‌های ریز.</desc>
  <!--
    همان طاق، تو‌پُر، با سنگِ کلید به‌صورت فضای منفی. سیلوئت در ۱۶ پیکسل هم
    باز می‌ماند، جایی که نسخهٔ خطی به هم می‌چسبد.
  -->
