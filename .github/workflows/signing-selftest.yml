# TEMPORARY — proves the zipalign/apksigner sequence in release.yml actually
# works on a runner, using a throwaway keystore. Deleted before this merges.
name: Signing self-test

on:
  push:
    branches: [claude/asameet-messaging-platform-hv7npi]
    paths:
      - ".github/workflows/signing-selftest.yml"
      - ".github/workflows/release.yml"

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make a throwaway keystore and base64 it, exactly as documented
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/throwaway.jks" -alias selftest \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass 'selftest-pass' -keypass 'selftest-pass' \
            -dname "CN=Selftest, O=Asameet, C=IR"
          base64 -w0 "$RUNNER_TEMP/throwaway.jks" > "$RUNNER_TEMP/ks.b64"
          echo "b64 bytes: $(wc -c < "$RUNNER_TEMP/ks.b64")"

      - name: Decode it the way release.yml does
        run: |
          set -euo pipefail
          KEYSTORE_B64="$(cat "$RUNNER_TEMP/ks.b64")"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          [ -s "$RUNNER_TEMP/release.jks" ] || { echo "decode produced nothing"; exit 1; }
          cmp "$RUNNER_TEMP/throwaway.jks" "$RUNNER_TEMP/release.jks"
          echo "round trip identical"

      - name: Build an unsigned release APK
        working-directory: mobile/asameet
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx cap add android && npx cap sync android
          cd android && ./gradlew assembleRelease --no-daemon
          find app/build/outputs/apk/release -name '*.apk'

      - name: Run the exact signing sequence from release.yml
        working-directory: mobile/asameet/android
        env:
          KEYSTORE_PASSWORD: selftest-pass
          KEY_ALIAS: selftest
          KEY_PASSWORD: ""
        run: |
          set -euo pipefail
          UNSIGNED="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          [ -n "$UNSIGNED" ] || { echo "no APK"; exit 1; }
          echo "Built $UNSIGNED"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          echo "Using build-tools at $BUILD_TOOLS"

          : "${KEY_PASSWORD:=$KEYSTORE_PASSWORD}"
          export KEYSTORE_PASSWORD KEY_PASSWORD

          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/signed.apk" \
            "$RUNNER_TEMP/aligned.apk"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/signed.apk"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$RUNNER_TEMP/signed.apk" > /dev/null && echo "alignment OK"
          ls -lh "$RUNNER_TEMP/signed.apk"
