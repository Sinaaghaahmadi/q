name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # CI never depends on upstream rate sources (§17.21).
  RATES_DEMO_MODE: "true"

jobs:
  quality:
    name: Lint · Typecheck · Unit · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Message catalogues (§18)
        run: pnpm messages
      - name: Version in step with package.json
        run: node scripts/check-version.mjs
      # A lucide icon handed to a client component is a runtime 500 that both
      # tsc and `next build` are perfectly happy with. Three times now.
      - name: No component functions cross the client boundary
        run: pnpm boundary
      - run: pnpm build
      - name: Performance budget (§20)
        run: pnpm budget

  e2e:
    name: Playwright — smoke + WCAG 2.1 AA (fa/en, RTL/LTR, light/dark)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deployment:
    name: Deployment — shell, compose, image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every one of these is run as root on a production server. A stray
      # apostrophe in a `${VAR:?message}` cost an afternoon once; it is a
      # parse error, so a parser can find it.
      - name: Shell scripts parse
        run: |
          for f in deploy/scripts/*.sh; do
            bash -n "$f" || { echo "::error file=$f::syntax error"; exit 1; }
          done

      - name: Shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # SC1091: sourcing deploy/.env, which does not exist in the repo.
          shellcheck --external-sources --exclude=SC1091 deploy/scripts/*.sh

      # A compose file that does not interpolate is a deploy that fails after
      # the maintenance window has already started.
      - name: Compose file is valid
        run: |
          cp deploy/.env.example deploy/.env.ci
          sed -i 's|^DOMAIN=.*|DOMAIN=example.test|; s|^ACME_EMAIL=.*|ACME_EMAIL=ci@example.test|' deploy/.env.ci
          # The generated values are placeholders in .env.example; compose only
          # needs them to be non-empty to validate.
          sed -i 's|<generated by deploy/scripts/gen-secrets.sh>|ci-placeholder-value|' deploy/.env.ci
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env.ci config >/dev/null

      # No published port may reach the internet except the proxy's. This is
      # the check that a future edit cannot quietly put Postgres on 0.0.0.0.
      - name: Only the proxy is exposed
        run: |
          cp deploy/.env.example deploy/.env.ci
          sed -i 's|^DOMAIN=.*|DOMAIN=example.test|; s|^ACME_EMAIL=.*|ACME_EMAIL=ci@example.test|' deploy/.env.ci
          sed -i 's|<generated by deploy/scripts/gen-secrets.sh>|ci-placeholder-value|' deploy/.env.ci
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env.ci config --format json \
            | node -e "
              let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
                const c=JSON.parse(s), bad=[];
                for (const [name, svc] of Object.entries(c.services||{})) {
                  for (const p of svc.ports||[]) {
                    const host = p.host_ip ?? '0.0.0.0';
                    const open = host === '0.0.0.0' || host === '::';
                    if (open && name !== 'caddy') bad.push(name+' publishes '+p.published+' on '+host);
                  }
                }
                if (bad.length) { console.error('Exposed to the internet:\n  '+bad.join('\n  ')); process.exit(1); }
                console.log('Only caddy publishes a port. Correct.');
              });"

      - name: The application image builds
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=https://example.test \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=ci \
            --build-arg NEXT_PUBLIC_APP_URL=https://example.test \
            -t asaex-app:ci .
          # The runtime layer must not carry the toolchain that built it.
          #
          # Not "no node_modules/.pnpm" — a standalone build legitimately has
          # one, holding the dependencies Next traced. The check that means
          # something is how *many*: this repo installs 573 packages and the
          # traced set is about 19, so a number near the former is `output:
          # "standalone"` having been turned off, and a gigabyte of image.
          docker run --rm --entrypoint sh asaex-app:ci -c '
            traced=$(ls /app/node_modules/.pnpm 2>/dev/null | wc -l)
            test "$traced" -lt 120 || { echo "node_modules has $traced packages — standalone tracing is off"; exit 1; }
            test ! -d /app/src || { echo "source shipped in the runtime image"; exit 1; }
            for t in pnpm npm npx tsc next; do
              command -v $t >/dev/null 2>&1 && { echo "$t is present in the runtime image"; exit 1; }
            done
            test "$(id -un)" = nextjs || { echo "not running as the unprivileged user"; exit 1; }
            echo "runtime image: $traced traced packages, no toolchain, running as $(id -un)"'
