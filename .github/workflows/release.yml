name: Publish Release

# Cutting a `v*` tag builds both Android apps against production and publishes
# them on a GitHub Release, so the download links in the site footer resolve to
# real files instead of an empty releases page.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. v1.0.0 — the tag is created on the dispatched ref"
        required: true
        default: "v1.0.0"
      app_url:
        description: "Web app URL the APKs point at"
        required: false
        default: "https://asameet.vercel.app"

permissions:
  contents: write

env:
  # Release builds point at production, where the real APIs live — unlike CI
  # builds, which target the serverless static demo.
  DEFAULT_APP_URL: "https://asameet.vercel.app"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dir: mobile/asameet
            name: asameet
            url_suffix: ""
          - dir: mobile/asameet-messenger
            name: asameet-messenger
            url_suffix: "/?mode=messenger"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Point app at production
        working-directory: ${{ matrix.dir }}
        run: |
          APP_URL="${{ github.event.inputs.app_url || env.DEFAULT_APP_URL }}"
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
            cfg.server.url = '$APP_URL${{ matrix.url_suffix }}';
            fs.writeFileSync('capacitor.config.json', JSON.stringify(cfg, null, 2));
          "
          cat capacitor.config.json

      - name: Install Capacitor
        working-directory: ${{ matrix.dir }}
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        working-directory: ${{ matrix.dir }}
        run: npx cap add android && npx cap sync android

      # Without this, every APK identifies itself as "1.0" — the Capacitor
      # template default — no matter which tag built it.
      - name: Stamp the app version from the release tag
        working-directory: ${{ matrix.dir }}/android/app
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          V="${VERSION#v}"
          IFS=. read -r MA MI PA <<< "$V"
          CODE=$((MA*10000 + MI*100 + PA))
          sed -i "s/versionCode 1$/versionCode $CODE/; s/versionName \"1.0\"$/versionName \"$V\"/" build.gradle
          grep -nE "versionCode|versionName" build.gradle

      - name: Generate launcher icons
        working-directory: ${{ matrix.dir }}
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0d9488' --iconBackgroundColorDark '#042f2e' --splashBackgroundColor '#f0fdfa' --splashBackgroundColorDark '#042f2e' || echo "icon generation skipped"

      # The keystore never touches the workspace: it lands in the runner's temp
      # dir, which is not uploaded as an artifact and is wiped with the runner.
      - name: Unpack the release keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret — falling back to a debug build."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Pasting base64 into a browser field routinely picks up CRs, wraps or
          # stray spaces. A bare LF is fine for base64 -d, a CR is not — so strip
          # every whitespace character before decoding rather than making whoever
          # sets the secret paste it perfectly.
          CLEAN="$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]')"

          # Describe a bad secret by shape only — never echo any of it. Lengths
          # and counts are enough to tell "pasted the wrong thing" from
          # "pasted a truncated blob".
          LEN=${#CLEAN}
          BAD=$(printf '%s' "$CLEAN" | tr -d 'A-Za-z0-9+/=' | wc -c)
          if ! printf '%s' "$CLEAN" | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64: $LEN characters after trimming whitespace, of which $BAD are outside the base64 alphabet. It should be one long line of only A-Z a-z 0-9 + / = — the entire contents of the file produced by: base64 -w0 my-release-key.jks"
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 decoded to an empty file — the secret is probably truncated."
            exit 1
          fi

          # Decoding to *some* bytes is not proof it is the right keystore, and a
          # wrong password should say so here rather than deep inside apksigner.
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '[:space:]')" >/dev/null 2>&1; then
            echo "::error::The keystore decoded but could not be opened. Either ANDROID_KEYSTORE_PASSWORD is wrong, or the base64 is of a different/partial file."
            exit 1
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: steps.keystore.outputs.available == 'true'
        working-directory: ${{ matrix.dir }}/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::ANDROID_KEY_ALIAS is empty. Set it to the alias you passed to keytool -alias."
            exit 1
          fi

          ./gradlew assembleRelease --no-daemon

          # Capacitor's generated project has no signingConfig, so Gradle leaves
          # the APK unsigned — we align it and sign it ourselves with apksigner.
          UNSIGNED="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          if [ -z "$UNSIGNED" ]; then
            echo "::error::assembleRelease produced no APK."
            exit 1
          fi
          echo "Built $UNSIGNED"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          echo "Using build-tools at $BUILD_TOOLS"

          # Every secret gets the same treatment as the keystore blob: pasted
          # values pick up stray whitespace, and apksigner sees them raw.
          KEYSTORE_PASSWORD="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '[:space:]')"
          KEY_PASSWORD="$(printf '%s' "$KEY_PASSWORD" | tr -d '[:space:]')"
          KEY_ALIAS="$(printf '%s' "$KEY_ALIAS" | tr -d '[:space:]')"

          # A key password is optional: keystores often reuse the store password.
          : "${KEY_PASSWORD:=$KEYSTORE_PASSWORD}"
          export KEYSTORE_PASSWORD KEY_PASSWORD

          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"

          sign_apk() {
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$RUNNER_TEMP/release.jks" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass env:KEY_PASSWORD \
              --out "$RUNNER_TEMP/signed.apk" \
              "$RUNNER_TEMP/aligned.apk"
          }

          # The store opening but the key refusing its password almost always
          # means ANDROID_KEY_PASSWORD was mis-pasted while the keystore really
          # uses one password for both — keytool's default. Retrying with the
          # store password turns that misconfiguration into a warning instead
          # of a dead release; a keystore with genuinely distinct passwords
          # still fails both attempts and stops the build.
          if ! sign_apk; then
            if [ "$KEY_PASSWORD" != "$KEYSTORE_PASSWORD" ]; then
              echo "::warning::ANDROID_KEY_PASSWORD was rejected for alias '$KEY_ALIAS'; retrying with the store password."
              KEY_PASSWORD="$KEYSTORE_PASSWORD"
              export KEY_PASSWORD
              sign_apk
            else
              echo "::error::The key under alias '$KEY_ALIAS' refused the store password. The keystore uses a distinct key password — set ANDROID_KEY_PASSWORD to it."
              exit 1
            fi
          fi

          # Fail the build rather than ship something that will not install.
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/signed.apk"

      - name: Build debug APK
        if: steps.keystore.outputs.available != 'true'
        working-directory: ${{ matrix.dir }}/android
        run: |
          set -euo pipefail
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/signed.apk"

      - name: Name the APK after its version
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          mkdir -p dist
          cp "$RUNNER_TEMP/signed.apk" "dist/${{ matrix.name }}-${VERSION}.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: dist/*.apk

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - run: ls -lh dist

      # The changelog is the single source of release notes: the section for
      # this version becomes the body, so notes are versioned with the code.
      - name: Release notes from the changelog
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          V="${VERSION#v}"
          awk -v v="$V" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {if (f) exit} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "_(برای این نسخه بخشی در CHANGELOG.md ثبت نشده است.)_" > notes.md
          fi
          cat notes.md

      # The release notes must not claim the APKs are signed when they are not.
      - name: Describe how these APKs are signed
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo 'note=این فایل‌ها با کلید انتشار شما امضا شده‌اند (زیرساخت v1+v2+v3) و آمادهٔ بارگذاری در Google Play، کافه‌بازار و مایکت هستند.' >> "$GITHUB_OUTPUT"
          else
            echo 'note=**توجه:** کلید انتشار روی مخزن تنظیم نشده، بنابراین این‌ها بیلد debug و امضانشده‌اند — برای نصب دستی مناسب‌اند، ولی برای بارگذاری در فروشگاه‌ها نه. راهنمای تنظیم کلید در ANDROID.md آمده است.' >> "$GITHUB_OUTPUT"
          fi

      - name: Compose the release body
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          {
            echo "## آسامیت — بستر هوشمند گفت‌وگو"
            echo
            cat notes.md
            echo
            echo "---"
            echo
            echo "| فایل | توضیح |"
            echo "| --- | --- |"
            echo "| \`asameet-${VERSION}.apk\` | نسخهٔ کامل — چت، تماس، جلسه، کلاس، پنل مدیریت |"
            echo "| \`asameet-messenger-${VERSION}.apk\` | فقط پیام‌رسان |"
            echo
            echo "### نصب"
            echo
            echo "فایل را روی گوشی دانلود کنید و اجازهٔ نصب از منابع ناشناس را بدهید."
            echo
            echo '${{ steps.signing.outputs.note }}'
            echo
            echo "### حساب کاربری"
            echo
            echo "ثبت‌نام با نام کاربری و رمز عبور از داخل خود اپ انجام می‌شود. اولین حسابی که در بستر ساخته شود، مدیر سامانه است."
            echo
            echo "### سایر خروجی‌ها"
            echo
            echo "- وب و PWA: <https://asameet.vercel.app>"
          } > release-body.md
          cat release-body.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: آسامیت ${{ github.event.inputs.version || github.ref_name }}
          files: dist/*.apk
          generate_release_notes: false
          body_path: release-body.md
