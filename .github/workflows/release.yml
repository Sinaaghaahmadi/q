name: Publish Release

# Cutting a `v*` tag builds both Android apps against production and publishes
# them on a GitHub Release, so the download links in the site footer resolve to
# real files instead of an empty releases page.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. v1.0.0 — the tag is created on the dispatched ref"
        required: true
        default: "v1.0.0"
      app_url:
        description: "Web app URL the APKs point at"
        required: false
        default: "https://asameet.vercel.app"

permissions:
  contents: write

env:
  # Release builds point at production, where the real APIs live — unlike CI
  # builds, which target the serverless static demo.
  DEFAULT_APP_URL: "https://asameet.vercel.app"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dir: mobile/asameet
            name: asameet
            url_suffix: ""
          - dir: mobile/asameet-messenger
            name: asameet-messenger
            url_suffix: "/?mode=messenger"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Point app at production
        working-directory: ${{ matrix.dir }}
        run: |
          APP_URL="${{ github.event.inputs.app_url || env.DEFAULT_APP_URL }}"
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
            cfg.server.url = '$APP_URL${{ matrix.url_suffix }}';
            fs.writeFileSync('capacitor.config.json', JSON.stringify(cfg, null, 2));
          "
          cat capacitor.config.json

      - name: Install Capacitor
        working-directory: ${{ matrix.dir }}
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        working-directory: ${{ matrix.dir }}
        run: npx cap add android && npx cap sync android

      - name: Generate launcher icons
        working-directory: ${{ matrix.dir }}
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0d9488' --iconBackgroundColorDark '#042f2e' --splashBackgroundColor '#f0fdfa' --splashBackgroundColorDark '#042f2e' || echo "icon generation skipped"

      - name: Build APK
        working-directory: ${{ matrix.dir }}/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK after its version
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          mkdir -p dist
          cp "${{ matrix.dir }}/android/app/build/outputs/apk/debug/app-debug.apk" \
             "dist/${{ matrix.name }}-${VERSION}.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: dist/*.apk

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - run: ls -lh dist

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: آسامیت ${{ github.event.inputs.version || github.ref_name }}
          files: dist/*.apk
          generate_release_notes: false
          body: |
            ## آسامیت — بستر هوشمند گفت‌وگو

            هر دو اپلیکیشن اندروید به نسخهٔ production وصل‌اند: <https://asameet.vercel.app>

            | فایل | توضیح |
            | --- | --- |
            | `asameet-${{ github.event.inputs.version || github.ref_name }}.apk` | نسخهٔ کامل — چت، تماس، جلسه، کلاس، پنل مدیریت |
            | `asameet-messenger-${{ github.event.inputs.version || github.ref_name }}.apk` | فقط پیام‌رسان |

            ### نصب

            فایل را روی گوشی دانلود کنید و اجازهٔ نصب از منابع ناشناس را بدهید.
            این‌ها بیلدهای debug و امضانشده‌اند؛ برای انتشار در بازار یا Google Play
            باید با کلید خودتان امضا شوند.

            ### حساب‌های دمو

            `admin` / `sara` / `amir` — رمز هر سه: `123456`

            ### سایر خروجی‌ها

            - وب و PWA: <https://asameet.vercel.app>
            - دموی استاتیک: <https://sinaaghaahmadi.github.io/q/>
