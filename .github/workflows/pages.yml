name: Deploy Static Demo (GitHub Pages)

on:
  push:
    branches: [main, claude/asameet-messaging-platform-hv7npi]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci --no-audit --no-fund

      # The static demo answers API calls in the browser (src/lib/client-api.ts);
      # server route handlers cannot be part of a static export.
      - name: Drop server API routes for static export
        run: rm -rf src/app/api

      - name: Build static export
        run: npm run build
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_STATIC: "1"
          NEXT_PUBLIC_BASE_PATH: /q
          NEXT_PUBLIC_APP_URL: https://sinaaghaahmadi.github.io/q

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
