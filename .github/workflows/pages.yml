name: Deploy Static Demo (GitHub Pages)

on:
  push:
    branches: [main, claude/asameet-messaging-platform-hv7npi]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # The static demo answers API calls in the browser (src/lib/client-api.ts);
      # server route handlers cannot be part of a static export.
      - name: Drop server API routes for static export
        run: rm -rf src/app/api

      - name: Build static export
        run: npm run build
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_STATIC: "1"
          NEXT_PUBLIC_BASE_PATH: /q
          NEXT_PUBLIC_APP_URL: https://sinaaghaahmadi.github.io/q

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true
          commit_message: "Deploy static demo"
