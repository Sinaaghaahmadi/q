# Asameet self-hosted stack. The database is managed Postgres (Supabase),
# so the web container is the whole stack — see docs/DEPLOYMENT.md.
services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_APP_URL=${APP_URL:-http://localhost:3000}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
