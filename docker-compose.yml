# Asameet self-hosted stack: web app + realtime chat service.
# See docs/DEPLOYMENT.md for the full server + domain migration guide.
services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_APP_URL=${APP_URL:-http://localhost:3000}
      - NEXT_PUBLIC_SOCKET_URL=${SOCKET_URL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DATABASE_URL=file:/data/asameet.db
    volumes:
      - asameet-data:/data
    depends_on:
      - chat

  chat:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /srv
    command: sh -c "npm install --omit=dev --no-audit --no-fund && node index.js"
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - CORS_ORIGIN=${APP_URL:-http://localhost:3000}
    volumes:
      - ./mini-services/chat-service:/srv

volumes:
  asameet-data:
